  <style id="run-wire-page-style">
#run-wire-connection-preview{padding:12px 20px;background:#142239;color:#eef5ff;border-bottom:1px solid #3a5371}
#run-wire-connection-preview>strong{font-size:17px;display:block;margin-bottom:10px}
.run-wire-connection-equipment{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.run-wire-connection-equipment .run-canvas-component-preview{display:flex;align-items:center;gap:12px;border:1px solid #425b79;border-radius:7px;padding:8px 12px;min-width:180px;min-height:80px}
.run-wire-connection-equipment .run-canvas-component-preview img{width:74px;height:74px;object-fit:contain;background:#f4f6f8;border-radius:4px}
.run-wire-connection-equipment .run-canvas-component-preview span{font-size:11px;color:#a9bfd9}
.run-wire-connection-equipment .run-canvas-component-preview small{font-weight:700}
.run-wire-connection-equipment>span{font-size:22px;color:#70bdf4}

/* Dedicated full-screen Run Wire Editor (other pickers remain unchanged). */
#equipmentModal.run-wire-fullpage{inset:0;padding:0;align-items:stretch;justify-content:stretch}
#equipmentModal.run-wire-fullpage .modal-wrapper{width:100vw;height:100vh;max-width:none;gap:0;display:flex;flex-direction:column;align-items:stretch}
#equipmentModal.run-wire-fullpage .modal-content{order:0;width:100vw;max-width:none;height:auto;max-height:none;min-height:0;flex:1;border-radius:0;padding:14px 22px}
#equipmentModal.run-wire-fullpage #assemblyPanel{order:1;width:100%;max-width:none;min-width:0;flex-shrink:0;padding:8px 22px;background:#0e1b30;border-top:1px solid #3a5371}
#equipmentModal.run-wire-fullpage .modal-body{min-height:0;flex:1}
#equipmentModal.run-wire-fullpage .modal-header{margin-bottom:6px;padding-bottom:8px}
#equipmentModal.run-wire-fullpage #run-wire-connection-preview{padding:8px 14px}
#equipmentModal.run-wire-fullpage .run-wire-connection-equipment .run-canvas-component-preview{min-height:65px}
#equipmentModal.run-wire-fullpage .run-wire-connection-equipment img{height:58px;width:58px}

/* Override legacy modal dimensions only while the wire editor is active. */
html body #equipmentModal.run-wire-fullpage{position:fixed!important;inset:0!important;width:100vw!important;height:100dvh!important;max-width:none!important;max-height:none!important;margin:0!important;padding:0!important;overflow:hidden!important;z-index:99999!important;display:flex!important}
html body #equipmentModal.run-wire-fullpage>.modal-wrapper{box-sizing:border-box;width:100%!important;height:100%!important;min-height:0!important;max-width:none!important;max-height:none!important;margin:0!important;padding:0!important;gap:0!important;align-items:stretch!important;overflow:hidden!important}
html body #equipmentModal.run-wire-fullpage .modal-content{box-sizing:border-box;width:100%!important;height:100%!important;max-width:none!important;max-height:none!important;min-height:0!important;flex:1 1 0!important;margin:0!important;border-radius:0!important;overflow:hidden!important}
html body #equipmentModal.run-wire-fullpage .modal-body{height:auto!important;min-height:0!important;flex:1 1 0!important;grid-template-columns:190px minmax(0,1fr)!important;overflow:hidden!important}
html body #equipmentModal.run-wire-fullpage .library-panel{height:100%!important;min-height:0!important;overflow:hidden!important}
html body #equipmentModal.run-wire-fullpage #assemblyPanel{box-sizing:border-box;flex:0 0 auto!important;max-height:24vh!important;overflow-y:auto!important;width:100%!important}
@media(min-width:1200px){html body #equipmentModal.run-wire-fullpage .modal-body{grid-template-columns:205px minmax(0,1fr)!important}}
</style>

    <div class="container">
      <aside class="sidebar">
        <h2>Library</h2>

        <input
          type="text"
          id="searchBox"
          placeholder="🔍 Search equipment..."
        />

        <div class="library-tabs">
          <button class="tab active">All</button>
          <button class="tab">Equipment</button>
          <button class="tab">Materials</button>
        </div>

        <div class="equipment-list">
          <div id="equipmentList"></div>
        </div>

        <div class="library-section">
          <div class="library-title">Presets</div>

          <div id="presetLibrary" class="preset-library"></div>
        </div>

        <div class="library-section">
          <div class="library-title">Materials</div>

          <button class="library-button">Add Material</button>
        </div>
      </aside>

      <main class="workspace">
        <!--==================================
    Workspace Toolbar
    ==================================-->

        <div class="workspace-toolbar">
          <button id="newProjectButton">📄 New</button>

          <button id="openProjectButton">📂 Open</button>

          <button id="saveButton">💾 Save</button>

          <button id="saveAsNewButton">💾 Save as New</button>

          <button id="saveAsTemplateButton">📐 Save as Template</button>
          <button id="openTemplateButton">📂 Templates</button>

          <button id="bomButton">📋 BOM</button>

          <button id="runMaterialsButton">🧰 Conduit &amp; Fittings</button>

          <button id="vanFittingPrototypeButton" title="Preview a VAN fitting estimate from the current template">
            ✨ VAN Fitting Guess
          </button>

          <button id="projectPhotosButton">🖼️ Photos</button>

          <button id="reloadMMLButton" title="Clear the local MML cache and load the latest material catalog">
            🔄 Reload MML
          </button>

          <button id="manualRouteButton">✏️ Manual Link</button>

          <div id="toolbarMaterialTotal" class="toolbar-material-total" title="Live total of the current BOM materials">
            <span>Total Amount</span>
            <strong>$0.00</strong>
          </div>
        </div>

        <!--==================================
    Layout
    ==================================-->

        <h2>Layout</h2>
        <button id="runsButton" class="workspace-floating-runs" type="button" title="Open Material Runs">📏 Runs</button>

        <div id="canvasContainer">
          <div id="grid"></div>

          <div id="previewLayer"></div>

          <svg id="svgLayer"></svg>
          <div id="canvasTemplateName" aria-label="Template name">Template Name</div>
        </div>
      </main>
    </div>

    <!-- BOM -->

    <div id="bomPanel" class="bom-panel">
      <div class="bom-title">Bill of Materials</div>

      <div id="bomBody">No Materials</div>
    </div>

    <!-- Link Inspector -->

    <div id="linkInspector" class="link-inspector collapsed">
      <div class="inspector-header">
        <h3>Link Properties</h3>
      </div>

      <div id="inspectorBody" class="inspector-body">No Link Selected</div>
    </div>

    <div id="equipmentModal" class="modal">

        <!-- ========================================= -->

        <!-- Modal Window -->
        <!-- ========================================= -->

            <h2>Place Node</h2>

            <button id="closeModal">&times;</button>

          <!-- ========================================= -->
          <!-- Search -->
          <!-- ========================================= -->

          <div class="modal-search-wrap"><input id="modalSearch" type="text" placeholder="Search node..." /><button id="modalSearchClear" type="button" aria-label="Clear search" title="Clear search">×</button></div>

          <div class="modal-body">
            <!-- Left Column -->

            <div class="filter-panel">
              <!-- ========================================= -->
              <!-- Connection Hardware Filters -->
              <!-- ========================================= -->

              <div id="modalFilters" class="modal-filters">
                <!-- Conduit -->

                <div class="filter-group">
                  <div class="filter-title">Conduit</div>

                  <div id="systemChips" class="chip-container"></div>
                </div>

                <!-- Fitting -->

                <div class="filter-group">
                  <div class="filter-title">Fitting</div>

                  <div id="typeChips" class="chip-container"></div>
                </div>

                <!-- Size -->

                <div class="filter-group">
                  <div class="filter-title">Size</div>

                  <div id="sizeChips" class="chip-container"></div>
                </div>
              </div>

              <!-- ========================================= -->
              <!-- Equipment Component Filters -->
              <!-- ========================================= -->

              <div
                id="equipmentFilters"
                class="modal-filters"
                style="display: none"
              >
                <div class="filter-group">
                  <div class="filter-title">Component</div>

                  <div
                    id="equipmentComponentChips"
                    class="chip-container"
                  ></div>
                </div>
              </div>
            </div>

            <!-- Right Column -->

            <div class="library-panel">
              <div id="modalList" class="modal-list"></div>
            </div>
          </div>
          <!-- modal-body -->
        </div>
        <!-- modal-content -->
      </div>
      <!-- modal-wrapper -->

<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Panel Builder</title>

    <link rel="stylesheet" href="styles/reset.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/library.css">
    <link rel="stylesheet" href="styles/canvas.css">
    <link rel="stylesheet" href="styles/connection.css">
    <link rel="stylesheet" href="styles/modal.css">
    <link rel="stylesheet" href="styles/inspector.css">
    <link rel="stylesheet" href="styles/bom.css">

    <!-- Uncomment when toolbar.css exists -->
    <!-- <link rel="stylesheet" href="styles/toolbar.css"> -->

</head>

<body>

    <div class="container">

        <aside class="sidebar">

            <h2>Library</h2>

            <input
                type="text"
                id="searchBox"
                placeholder="🔍 Search equipment..."
            >

            <div class="library-tabs">

                <button class="tab active">All</button>
                <button class="tab">Equipment</button>
                <button class="tab">Materials</button>

            </div>

            <div class="equipment-list">

                <div id="equipmentList"></div>

            </div>

            <div class="library-section">

                <div class="library-title">

                    Presets

                </div>

                <div
                    id="presetLibrary"
                    class="preset-library"
                ></div>

            </div>

            <div class="library-section">

                <div class="library-title">

                    Materials

                </div>

                <button class="library-button">

                    Add Material

                </button>

            </div>

        </aside>

        <main class="workspace">

            <div class="workspace-toolbar">

                <button id="newProjectButton">

                    📄 New

                </button>

                <button id="openProjectButton">

                    📂 Open

                </button>

                <button id="saveButton">

                    💾 Save

                </button>

            </div>

            <h2>Layout</h2>

            <div id="canvasContainer">

    <div id="grid"></div>

    <div id="previewLayer"></div>

    <svg id="svgLayer"></svg>

</div>

        </main>

    </div>

    <!-- BOM -->

    <div
        id="bomPanel"
        class="bom-panel"
    >

        <div class="bom-title">

            Bill of Materials

        </div>

        <div id="bomBody">

            No Materials

        </div>

    </div>

    <!-- Link Inspector -->

    <div
        id="linkInspector"
        class="link-inspector collapsed"
    >

        <div class="inspector-header">

            <h3>Link Properties</h3>

        </div>

        <div
            id="inspectorBody"
            class="inspector-body"
        >

            No Link Selected

        </div>

    </div>

   <!-- ========================================= -->
<!-- Modal -->
<!-- ========================================= -->

<div
    id="equipmentModal"
    class="modal"
>

    <div class="modal-wrapper">

        <!-- ========================================= -->
        <!-- Connection Assembly -->
        <!-- ========================================= -->

        <div
            id="assemblyPanel"
            class="connection-assembly"
        ></div>

        <!-- ========================================= -->
        <!-- Modal Window -->
        <!-- ========================================= -->

        <div class="modal-content">

            <div class="modal-header">

                <h2>Place Node</h2>

                <button id="closeModal">

                    &times;

                </button>

            </div>

            <!-- ========================================= -->
            <!-- Search -->
            <!-- ========================================= -->

            <input
                id="modalSearch"
                type="text"
                placeholder="Search node..."
            >

            <!-- ========================================= -->
            <!-- Filters -->
            <!-- ========================================= -->

            <div
                id="modalFilters"
                class="modal-filters"
            >

                <!-- Conduit -->

                <div class="filter-group">

                    <div class="filter-title">

                        Conduit

                    </div>

                    <div
                        id="systemChips"
                        class="chip-container"
                    ></div>

                </div>

                <!-- Fitting -->

                <div class="filter-group">

                    <div class="filter-title">

                        Fitting

                    </div>

                    <div
                        id="typeChips"
                        class="chip-container"
                    ></div>

                </div>

                <!-- Size -->

                <div class="filter-group">

                    <div class="filter-title">

                        Size

                    </div>

                    <div
                        id="sizeChips"
                        class="chip-container"
                    ></div>

                </div>

            </div>

            <!-- ========================================= -->
            <!-- Available Hardware -->
            <!-- ========================================= -->

            <div
                id="modalList"
                class="modal-list"
            ></div>

        </div>

    </div>

</div>

<!-- Filters -->

<div
    id="modalFilters"
    class="modal-filters"
>

    <!-- Conduit -->

    <div class="filter-group">

        <div
            id="sizeChips"
            class="chip-container"
        ></div>

    </div>

</div>

<div

></div>

<!-- ========================================= -->

<div
    id="modalList"
    class="modal-list"
></div>

        </div>

    </div>

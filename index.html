    <meta charset="UTF-8" />

    <link rel="stylesheet" href="styles/reset.css" />

  <body>
    <div class="container">
      <aside class="sidebar">
        <h2>Library</h2>

        <input
          type="text"
          id="searchBox"
          placeholder="🔍 Search equipment..."
        />

        <div class="library-tabs">
          <button class="tab active">All</button>
          <button class="tab">Equipment</button>
          <button class="tab">Materials</button>
        </div>

        <div class="equipment-list">
          <div id="equipmentList"></div>
        </div>

        <div class="library-section">
          <div class="library-title">Presets</div>

          <div id="presetLibrary" class="preset-library"></div>
        </div>

        <div class="library-section">
          <div class="library-title">Materials</div>

          <button class="library-button">Add Material</button>
        </div>
      </aside>

      <main class="workspace">
        <!--==================================
    Workspace Toolbar
    ==================================-->

        <div class="workspace-toolbar">
          <button id="newProjectButton">📄 New</button>

          <button id="openProjectButton">📂 Open</button>

          <button id="saveButton">💾 Save</button>

          <button id="saveAsNewButton">💾 Save as New</button>

          <button id="saveAsTemplateButton">📐 Save as Template</button>
          <button id="openTemplateButton">📂 Templates</button>

          <button id="bomButton">📋 BOM</button>

          <button id="runMaterialsButton">🧰 Conduit &amp; Fittings</button>

          <button id="projectPhotosButton">🖼️ Photos</button>

          <button id="reloadMMLButton" title="Clear the local MML cache and load the latest material catalog">
            🔄 Reload MML
          </button>

          <button id="manualRouteButton">✏️ Manual Link</button>
        </div>

        <!--==================================
    Layout
    ==================================-->

        <h2>Layout</h2>
        <button id="runsButton" class="workspace-floating-runs" type="button" title="Open Material Runs">📏 Runs</button>

        <div id="canvasContainer">
          <div id="grid"></div>

          <div id="previewLayer"></div>

          <svg id="svgLayer"></svg>
          <div id="canvasTemplateName" aria-label="Template name">Template Name</div>
        </div>
      </main>
    </div>

    <!-- BOM -->

    <div id="bomPanel" class="bom-panel">
      <div class="bom-title">Bill of Materials</div>

      <div id="bomBody">No Materials</div>
    </div>

    <!-- Link Inspector -->

    <div id="linkInspector" class="link-inspector collapsed">
      <div class="inspector-header">
        <h3>Link Properties</h3>
      </div>

      <div id="inspectorBody" class="inspector-body">No Link Selected</div>
    </div>

    <!-- ========================================= -->
    <!-- Modal -->
    <!-- ========================================= -->

    <div id="equipmentModal" class="modal">
      <div class="modal-wrapper">
        <!-- ========================================= -->
        <!-- Connection Assembly -->
        <!-- ========================================= -->

        <div id="assemblyPanel" class="connection-assembly"></div>

        <!-- ========================================= -->
        <!-- Modal Window -->
        <!-- ========================================= -->

        <div class="modal-content">
          <div class="modal-header">
            <h2>Place Node</h2>

            <button id="closeModal">&times;</button>
          </div>

          <!-- ========================================= -->
          <!-- Search -->
          <!-- ========================================= -->

          <div class="modal-search-wrap"><input id="modalSearch" type="text" placeholder="Search node..." /><button id="modalSearchClear" type="button" aria-label="Clear search" title="Clear search">×</button></div>

          <div class="modal-body">
            <!-- Left Column -->

            <div class="filter-panel">
              <!-- ========================================= -->
              <!-- Connection Hardware Filters -->
              <!-- ========================================= -->

              <div id="modalFilters" class="modal-filters">
                <!-- Conduit -->

                <div class="filter-group">
                  <div class="filter-title">Conduit</div>

                  <div id="systemChips" class="chip-container"></div>
                </div>

                <!-- Fitting -->

                <div class="filter-group">
                  <div class="filter-title">Fitting</div>

                  <div id="typeChips" class="chip-container"></div>
                </div>

                <!-- Size -->

                <div class="filter-group">
                  <div class="filter-title">Size</div>

                  <div id="sizeChips" class="chip-container"></div>
                </div>
              </div>

              <!-- ========================================= -->
              <!-- Equipment Component Filters -->
              <!-- ========================================= -->

              <div
                id="equipmentFilters"
                class="modal-filters"
                style="display: none"
              >
                <div class="filter-group">
                  <div class="filter-title">Component</div>

                  <div
                    id="equipmentComponentChips"
                    class="chip-container"
                  ></div>
                </div>
              </div>
            </div>

            <!-- Right Column -->

            <div class="library-panel">
              <div id="modalList" class="modal-list"></div>
            </div>
          </div>
          <!-- modal-body -->
        </div>
        <!-- modal-content -->
      </div>
      <!-- modal-wrapper -->
    </div>
    <!-- equipmentModal -->
